[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataagent-backend"
version = "0.1.0"
description = "DataAgent MCP Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "langgraph",
    "langchain-openai",
    "pandas",
    "duckdb",
    "pytest",
    "docker",
    "langchain>=1.4.2",
    "langsmith[openai-agents]>=0.13.0",
    "sqlglot>=30.18.0",
    "langchain-mcp-adapters>=0.3.2",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
